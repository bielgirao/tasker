<div class="container">
    <div class="main">
        <h3>Register</h3>
        <form [formGroup]="registerForm">

            <mat-form-field appearance="outline">
                <mat-label>Full Name</mat-label>
                <input
                    matInput
                    formControlName="name"
                    type="text"
                >
                <mat-error *ngIf="registerForm.get('name')?.touched && registerForm.get('name')?.invalid && registerForm.get('name')?.getError('required')">
                    Name is required.
                </mat-error>
                <mat-error *ngIf="registerForm.get('name')?.touched && registerForm.get('name')?.invalid && registerForm.get('name')?.getError('maxlength')">
                    Name should have less than 25 characters.
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Email</mat-label>
                <input
                    matInput
                    formControlName="email"
                    placeholder="example@mail.com"
                    type="email"
                >
                <mat-error *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid && registerForm.get('email')?.getError('required')">
                    Email is required.
                </mat-error>
                <mat-error *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid && registerForm.get('email')?.getError('email')">
                    Please enter a valid email address.
                </mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Password</mat-label>
                <input matInput
                       formControlName="password"
                       type="password"
                >
                <mat-error *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid && registerForm.get('password')?.getError('required')">
                    Password is required.
                </mat-error>
                <mat-error *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid && registerForm.get('password')?.getError('minlength')">
                    Password should have at least 6 characters.
                </mat-error>
            </mat-form-field>

            <button
                mat-flat-button
                color="accent"
                aria-label="Register Now"
                class="primary-button"
                size="medium"
                (click)="onSubmit()"
                [disabled]="!registerForm.valid"
            >
                Register Now
            </button>
        </form>
        <a
            [routerLink]="['/login']"
            class="login-link"
        >
            Already registered? Log in to your account now.
        </a>
    </div>
</div>
